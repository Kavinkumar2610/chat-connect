<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Telegram</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="page">
    <div class="card">
      <ion-input label="Username" labelPlacement="stacked" fill="outline" type="text" autocomplete="username" [(ngModel)]="username"></ion-input>
      <ion-input label="Phone number" labelPlacement="stacked" fill="outline" type="tel" autocomplete="tel" [(ngModel)]="phoneNumber" helperText="Used when no username is given"></ion-input>
      <ion-button expand="block" size="large" [disabled]="!username && !phoneNumber" (click)="startChat()">Open Telegram</ion-button>
    </div>
  </main>
</ion-content>
