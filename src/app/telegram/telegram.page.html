<ion-header>
  <ion-toolbar>
    <ion-title>Telegram</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-input label="Username" labelPlacement="stacked" type="text" [(ngModel)]="username"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Phone Number" labelPlacement="stacked" type="tel" [(ngModel)]="phoneNumber"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="startChat()">Start Chat</ion-button>
</ion-content>
