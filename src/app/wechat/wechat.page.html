<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>WeChat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="page">
    <div class="card">
      <ion-input label="WeChat ID" labelPlacement="stacked" fill="outline" type="text" [(ngModel)]="wechatId"></ion-input>
      <ion-button expand="block" size="large" [disabled]="!wechatId" (click)="startChat()">Open WeChat</ion-button>
    </div>
  </main>
</ion-content>
