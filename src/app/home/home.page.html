<ion-content class="ion-padding">
  <div class="logo-container">
    <img class="logo" src="assets/logo.png" alt="Logo">
  </div>
  <div class="greeting">
    {{ greeting }}
  </div>
  <ion-list class="app-list">
    <ion-item-divider class="divider"></ion-item-divider>
    <ion-item button (click)="openApp('whatsapp')" class="app-item" color="light">
      <ion-avatar slot="start">
        <img src="assets/whatsapp.png">
      </ion-avatar>
      <ion-label class="app-label">WhatsApp</ion-label>
    </ion-item>
    <ion-item-divider class="divider"></ion-item-divider>
    <ion-item button class="app-item disabled" color="light">
      <ion-avatar slot="start">
        <!-- <img src="assets/telegram.png"> -->
        <img src="assets/telegrambw.png">
      </ion-avatar>
      <ion-label class="app-label">Telegram</ion-label>
    </ion-item>
    <ion-item-divider class="divider"></ion-item-divider>
    <ion-item button class="app-item disabled" color="light">
      <ion-avatar slot="start">
        <!-- <img src="assets/wechat.png"> -->
        <img src="assets/wechatbw.png">
      </ion-avatar>
      <ion-label class="app-label">WeChat</ion-label>
    </ion-item>
    <ion-item-divider class="divider"></ion-item-divider>
    <ion-item button (click)="openApp('call-dialer')" class="app-item" color="light">
      <ion-avatar slot="start">
        <!-- You can replace the src attribute with the icon for the Call Dialer app -->
        <img src="assets/dialer.png">
      </ion-avatar>
      <ion-label class="app-label">Call Dialer</ion-label>
    </ion-item>
<ion-item-divider class="divider"></ion-item-divider>
  </ion-list>

  <!-- Version label -->
  <div class="version-label">
    App Version: 2.0.0 <!-- Replace with your app version -->
  </div>
</ion-content>
