<ion-content>
  <main class="page home">
    <header class="hero">
      <div class="top-bar">
        <img class="logo" src="assets/logo.png" alt="ChatConnect" width="144" height="50">
        <div class="theme-toggle">
          <ion-icon [name]="theme.dark ? 'moon' : 'moon-outline'" aria-hidden="true"></ion-icon>
          <ion-toggle aria-label="Dark mode" [checked]="theme.dark" (ionChange)="theme.setDark($event.detail.checked)"></ion-toggle>
        </div>
      </div>
      <h1>{{ greeting }}</h1>
      <p class="page-intro">Start a conversation without saving the contact first.</p>
    </header>

    <ion-list [inset]="true" lines="inset">
      @for (channel of channels; track channel.name) {
        @if (channel.route) {
          <ion-item button [routerLink]="channel.route" detail>
            <img slot="start" class="channel-icon" [src]="channel.icon" alt="" width="44" height="44">
            <ion-label>
              <h2>{{ channel.name }}</h2>
              <p>{{ channel.description }}</p>
            </ion-label>
          </ion-item>
        } @else {
          <ion-item class="soon">
            <img slot="start" class="channel-icon" [src]="channel.icon" alt="" width="44" height="44">
            <ion-label>
              <h2>{{ channel.name }}</h2>
              <p>{{ channel.description }}</p>
            </ion-label>
            <ion-badge slot="end" color="light">Coming soon</ion-badge>
          </ion-item>
        }
      }
    </ion-list>

    <p class="version">Version {{ version }}</p>
  </main>
</ion-content>
